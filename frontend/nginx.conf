# Nginx config for the SPA container.
#
# - Serves the built SPA and falls back to index.html so client-side routes work
#   on a hard refresh.
# - Proxies /api to the backend container, which keeps the browser same-origin
#   and avoids CORS in the composed stack.
# - Adds HTTPS-friendly security headers.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. HSTS is intentionally omitted here because TLS is
    # usually terminated by the platform in front of this container; add it at
    # the load balancer once HTTPS is enforced.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;

    # Hashed build assets are safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy to the backend service on the compose network.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every unknown path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
