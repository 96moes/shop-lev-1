# Docker Compose for local/staging: PostgreSQL, the API and the SPA.
#
# Credentials are NOT hard-coded. Copy `.env.docker.example` to `.env.docker`
# and fill it in, then:
#
#   docker compose --env-file .env.docker up --build
#
# Compose reads the variables below from that file and refuses to start if a
# required secret is missing (`:?`), rather than silently falling back to a
# development default.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The backend waits for this before migrating, so it must be meaningful.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host by default: only the backend needs to reach it.
    expose:
      - '5432'

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-https://api-m.paypal.com}
    # Applies pending migrations, then starts the API. Both steps run compiled
    # JavaScript, so no TypeScript loader is needed in the runtime image.
    command: sh -c "node ./node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js && node dist/main.js"
    ports:
      - '${BACKEND_PORT:-3000}:3000'

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin by default: nginx proxies /api to the backend.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-8080}:80'

volumes:
  postgres-data:
